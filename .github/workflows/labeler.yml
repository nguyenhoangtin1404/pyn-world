# Labels every PR: by the files it changes (.github/labeler.yml), by its type from the title
# (feat → "type: feature"…), by size, and "breaking change" for `type!:`.
# pull_request_target so it can label PRs from forks too; it never checks out or runs the PR's code.
name: Label PR

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label by changed files
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
      - name: Label by type and size
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const TYPES = {
              feat: ['type: feature', '1d76db'], fix: ['type: bug', 'd73a4a'], perf: ['type: performance', 'fbca04'],
              refactor: ['type: refactor', 'c5def5'], test: ['type: test', 'bfd4f2'], docs: ['type: docs', '0075ca'],
              build: ['type: build', 'ededed'], ci: ['type: ci', 'ededed'], chore: ['type: chore', 'ededed'],
              style: ['type: style', 'ededed'], revert: ['type: revert', 'b60205'],
            };
            const SIZES = [[10, 'size: XS'], [100, 'size: S'], [500, 'size: M'], [1000, 'size: L'], [Infinity, 'size: XL']];
            const m = /^(\w+)(\([^)]*\))?(!)?:/.exec(pr.title);
            const want = new Map();
            if (m && TYPES[m[1]]) want.set(...TYPES[m[1]]);
            if (m?.[3]) want.set('breaking change', 'b60205');
            const changed = pr.additions + pr.deletions;
            want.set(SIZES.find(([max]) => changed < max)[1], 'e4e669');

            const managed = (name) => name.startsWith('type: ') || name.startsWith('size: ') || name === 'breaking change';
            const current = pr.labels.map((l) => l.name);
            for (const name of current) {
              if (managed(name) && !want.has(name)) await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name });
            }
            const add = [...want.keys()].filter((name) => !current.includes(name));
            for (const name of add) {
              try {
                await github.rest.issues.createLabel({ owner, repo, name, color: want.get(name) });
              } catch (e) {
                if (e.status !== 422) throw e; // 422: the label exists already
              }
            }
            if (add.length) await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: add });
