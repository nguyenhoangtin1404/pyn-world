name: CodeQL

# Code scanning of the JavaScript: results go to the repo's Security tab and satisfy a branch rule
# that waits for "Code Scanning results". Turn this off if "Default setup" is enabled under
# Settings → Advanced Security (the two can't both upload results).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
